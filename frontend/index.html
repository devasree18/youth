    <script>
      // Safe fallback initialization for native Capacitor bridge to prevent triggerEvent startup race conditions
      if (typeof window !== 'undefined') {
        window.Capacitor = window.Capacitor || {};
        if (typeof window.Capacitor.triggerEvent !== 'function') {
          window.Capacitor.triggerEvent = function (eventName, target, eventData) {
            try {
              if (window.Capacitor.Plugins && window.Capacitor.Plugins[target]) {
                return true;
              }
            } catch (e) {}
            return true;
          };
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
